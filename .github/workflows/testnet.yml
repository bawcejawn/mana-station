name: testnet
# Manual only. Free standard runner, 20-minute cap. Harbinger TESTNET only, throwaway keys from the TESTNET_KEYS secret.
on:
  workflow_dispatch:
    inputs:
      run_testnet:
        description: "Run the Harbinger scenarios after the unit tests"
        default: "true"
permissions:
  contents: read
concurrency:
  group: harbinger-testnet   # never two runs against the same throwaway accounts at once
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: contracts/station
        run: npm ci --no-audit --no-fund
      - name: Unit tests (MockVM)
        working-directory: contracts/station
        run: npm test </dev/null
      - name: Write throwaway testnet keys (secret, masked)
        env:
          TESTNET_KEYS: ${{ secrets.TESTNET_KEYS }}
        run: |
          umask 077
          printf '%s' "$TESTNET_KEYS" > testnet/keys.testnet.json
          node -e 'const k=require("./testnet/keys.testnet.json");for(const v of Object.values(k))if(v&&v.wif)console.log("::add-mask::"+v.wif)'
          echo "MOCK_STABLE=$(node -p 'require("./testnet/keys.testnet.json").token.address')" >> "$GITHUB_ENV"
      - name: Build testnet station (VUSDT = mock token), then mainnet build + check
        working-directory: contracts/station
        run: |
          npm run build:testnet
          npm run build
          npm run check:mainnet
      - name: Build testapp and mock token
        run: |
          (cd contracts/testapp && npm run build)
          (cd contracts/mocktoken && npm run build)
      - name: Harbinger scenarios
        if: ${{ inputs.run_testnet == 'true' }}
        env:
          # Koinos Foundation public testnet node (Carl, Oct 19 10:05 PM). The script also refuses any chain id but the testnet's.
          # Optional override: the HARBINGER_RPC secret.
          RPC: ${{ secrets.HARBINGER_RPC || 'https://testnet.koinosfoundation.org' }}
        run: |
          set -o pipefail
          node testnet/run_tests.mjs 2>&1 | tee testnet/run.log
      # Surface the outcome as annotations too (readable via the API when raw logs aren't reachable).
      # The script never prints keys; WIFs are also masked above.
      - name: Report results as annotations
        if: always()
        run: |
          enc() { sed -e ':a;N;$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g'; }
          if [ -f testnet/results.md ]; then echo "::notice title=testnet results::$(head -c 60000 testnet/results.md | enc)"; fi
          if [ -f testnet/run.log ]; then echo "::warning title=run_tests last 60 lines::$(tail -n 60 testnet/run.log | enc)"; fi
      - name: Remove keys
        if: always()
        run: rm -f testnet/keys.testnet.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testnet-results
          path: |
            testnet/results.json
            testnet/results.md
            testnet/run.log
          retention-days: 7
