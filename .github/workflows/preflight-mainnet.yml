name: preflight-mainnet
# Manual only. Read-only checks of Koinos MAINNET before launch (audit-2026-10: K1-04 / A1-10, M-5, O1-09, M-8 prices):
# admin/preflight-mainnet.mjs. No secrets, no keys, sends no transaction. The report goes to the run's summary page.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Preflight (read-only)
        env:
          NETWORK: mainnet
        run: |
          set +e
          node admin/preflight-mainnet.mjs > preflight.md; code=$?
          cat preflight.md >> "$GITHUB_STEP_SUMMARY"; cat preflight.md
          # exit 2 = something to check (reported above), not a failure of the run
          [ "$code" = 0 ] || [ "$code" = 2 ]
