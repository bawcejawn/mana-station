name: playground
# Manual only. Runs testnet/playground.mjs against the Koinos testnet with the throwaway TESTNET_KEYS secret:
# deploy | status | handover <owner> <c1> <c2> <c3> | traffic [n] | mint <address> [amount]
on:
  workflow_dispatch:
    inputs:
      command:
        description: "deploy, status, handover, traffic or mint"
        default: "status"
      args:
        description: "Arguments (space-separated public addresses / numbers only)"
        default: ""
permissions:
  contents: read
concurrency:
  group: harbinger-testnet   # shares the throwaway accounts with the testnet workflow: never at the same time
  cancel-in-progress: false
jobs:
  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: contracts/station
        run: npm ci --no-audit --no-fund
      - name: Write throwaway testnet keys (secret, masked)
        env:
          TESTNET_KEYS: ${{ secrets.TESTNET_KEYS }}
        run: |
          umask 077
          printf '%s' "$TESTNET_KEYS" > testnet/keys.testnet.json
          node -e 'const k=require("./testnet/keys.testnet.json");for(const v of Object.values(k))if(v&&v.wif)console.log("::add-mask::"+v.wif)'
          echo "MOCK_STABLE=$(node -p 'require("./testnet/keys.testnet.json").token.address')" >> "$GITHUB_ENV"
      - name: Build testnet station, test app and mock token
        run: |
          (cd contracts/station && npm run build:testnet)
          (cd contracts/testapp && npm run build)
          (cd contracts/mocktoken && npm run build)
      - name: Run the playground command
        env:
          RPC: https://testnet.koinosfoundation.org
          CMD: ${{ inputs.command }}
          ARGS: ${{ inputs.args }}
        run: |
          set -o pipefail
          case "$CMD" in deploy|status|handover|traffic|mint) ;; *) echo "unknown command"; exit 1;; esac
          echo "$ARGS" | grep -Eq '^[1-9A-HJ-NP-Za-km-z0-9 .]*$' || { echo "args may only contain addresses and numbers"; exit 1; }
          node testnet/playground.mjs "$CMD" $ARGS 2>&1 | tee testnet/run.log
      - name: Report results as annotations
        if: always()
        run: |
          enc() { sed -e ':a;N;$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g'; }
          if [ -f testnet/results.md ]; then echo "::notice title=playground::$(head -c 3800 testnet/results.md | enc)"; fi
          if [ -f testnet/run.log ]; then echo "::warning title=playground log::$(tail -n 40 testnet/run.log | enc)"; fi
      - name: Remove keys
        if: always()
        run: rm -f testnet/keys.testnet.json
