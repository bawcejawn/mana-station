syntax = "proto3";

package station;

import "koinos/options.proto";

// ════════ Stored objects (v2 model, Carl 2026-10-19 4:13 PM) ════════
// Units: Mana and KOIN in satoshis (1 Mana = 100000000). "bp" = basis points (10000 = 100%).

message config_object {
  bytes owner = 1 [(koinos.btype) = ADDRESS];
  bool paused = 2;
  uint64 koin_amount = 3 [jstype = JS_STRING];      // configured station capacity (KOIN). Owner-flexible; budgets derive from it
  uint32 refill_bp = 4;                             // daily budget = koin_amount × refill_bp (2000 = 20% = one day's refill)
  uint64 admin_min = 5 [jstype = JS_STRING];        // untouchable Mana for admin / kill switch
  uint64 hard_max = 6 [jstype = JS_STRING];         // largest rc_limit for normal sponsored txs
  uint32 per_min = 7;
  uint64 cooldown_ms = 8 [jstype = JS_STRING];
  uint32 day_actions = 9;                           // per user, rolling 24 h
  uint64 day_mana = 10 [jstype = JS_STRING];
  uint32 new_actions = 11;
  uint64 new_mana = 12 [jstype = JS_STRING];
  uint32 new_pct = 13;                              // new users together: % of an app's allowance
  uint32 max_ops = 14;
  reserved 15;                                      // was sold_bp: the sellable slice is now derived (budget − reservations)
  uint64 big_max = 16 [jstype = JS_STRING];         // per big-upload request (Mana)
  uint64 big_cooldown_ms = 17 [jstype = JS_STRING]; // between big-upload purchases, PER BUYER (was station-wide: audit #2)
  uint64 big_week_cap = 18 [jstype = JS_STRING];    // total big uploads per rolling 7 days (Mana)
  uint64 big_max_debt = 19 [jstype = JS_STRING];    // reserve that big uploads may owe at once (Mana)
  uint64 big_ticket_ms = 20 [jstype = JS_STRING];   // ticket lifetime; 0 = default 24 h (Carl, 8:02 PM). Owner-adjustable
  uint32 max_allowances = 21;                       // sold allowances open at once (bounded loops)
  uint64 max_days = 22 [jstype = JS_STRING];        // longest prepaid period per buy / renew
  // Where ESCROW RELEASES go (Carl, 7:47 PM: payments are held in the station's escrow until the term ends).
  // Empty = the owner wallet. Must not be the station itself. Owner-changeable.
  // Default (empty) = DIRECT TO THE OWNER WALLET (Carl, 5:18 PM). Owner may set another address, or the station's own id.
  bytes treasury = 23 [(koinos.btype) = ADDRESS];
  // Fee-exempt reserved apps may go this far above their daily allowance (2000 = 20%: 3,000 → 3,600). The extra comes
  // straight from the reserve (Carl, 5:22 PM): no debt, no repayment, never below the hard floor (admin_min + budget).
  uint32 buffer_bp = 24;
  uint64 alert_mana = 25 [jstype = JS_STRING];      // emit station.reserve_low below this Mana (0 = default 15,000)
  // Big-upload ticket fee (Carl, 8:10 PM): on buyer cancel or expiry the station keeps max(this share of the price,
  // the pro-rata used share). 0 = default 500 (5%); max 2000 (20%). Refunds are only ever in the stablecoin paid.
  uint32 ticket_fee_bp = 26;
  reserved 27;                                      // was big_idle_ms (dropped for the time-based ticket model)
  // Audit #3: open (unexpired) allowances one buyer may hold at once. 0 = default 5.
  uint32 max_per_buyer = 28;
}

// Carl's reserved app: a fixed RESERVATION of Mana per rolling 24 h (absolute, so adding KOIN never changes it;
// the extra becomes sellable). Unused reservation is never sold. Only the owner can exceed it (expiring boost).
message app_object {
  uint64 reserved_mana = 1 [jstype = JS_STRING];   // e.g. 3,000 Mana/day for Knode
  bool active = 2;
  uint64 boost_mana = 3 [jstype = JS_STRING];       // owner-approved extra per 24 h
  uint64 boost_until = 4 [jstype = JS_STRING];
}

// Fee-exempt contract (Carl's projects). app > 0 links it to a reservation; app 0 = other Carl project whose usage
// can only come from the sellable slice. strict = only allowlisted entry points (with their caps).
// Exempt means fee-free, not limit-free: per-user, per-tx, rate, 20% daily cap and admin floor all apply.
message exempt_object {
  uint32 app = 1;
  bool strict = 2;
}

message exempt_event {
  bytes contract_id = 1 [(koinos.btype) = CONTRACT_ID];
  exempt_object value = 2;
  bool removed = 3;
}

message entry_object {
  uint32 app = 1;
  uint64 cap = 2 [jstype = JS_STRING];
  uint32 max_args = 3;
}

message window_object {
  uint64 base = 1 [jstype = JS_STRING];
  repeated uint32 n = 2;
  repeated uint64 mana = 3 [jstype = JS_STRING];
  repeated uint64 new_mana = 4 [jstype = JS_STRING];
}

message user_object {
  uint64 first_seen = 1 [jstype = JS_STRING];
  uint64 last_block = 2 [jstype = JS_STRING];
  uint64 minute = 3 [jstype = JS_STRING];
  uint32 n_min = 4;
  uint64 cooldown_until = 5 [jstype = JS_STRING];
  window_object day = 6;
}

// Price per accepted stablecoin (owner-set; Monetization prices it). Token address/decimals: see stablecoins.md.
// Prices per token (8 decimals). Tiers only: a buy or renew must be 1, 7 or 30 days; a tier priced 0 is not offered.
// Prices are owner-adjustable and apply to NEW purchases and renewals only: each allowance stores what it paid.
message price_object {
  bool active = 1;
  reserved 2, 3, 4;                                  // were per_mana_day / per_big_mana / min_days
  uint64 max_per_purchase = 5 [jstype = JS_STRING]; // token units; thin liquidity (stablecoins.md), owner-set
  uint64 price_1d = 6 [jstype = JS_STRING];         // token units per 1,000 Mana/day, whole 1-day term
  uint64 price_7d = 7 [jstype = JS_STRING];         // per 1,000 Mana/day, whole 7-day term
  uint64 price_30d = 8 [jstype = JS_STRING];        // per 1,000 Mana/day, whole 30-day term
  uint64 big_per_1000 = 9 [jstype = JS_STRING];     // token units per 1,000 Mana of big upload (one-time)
  uint64 big_min_mana = 10 [jstype = JS_STRING];    // smallest big-upload order (Mana, 8 decimals)
  // Audit #3: every purchase (allowance term or big-upload ticket) costs at least this much, in token units. 0 = none.
  uint64 min_purchase = 11 [jstype = JS_STRING];
}

// A sold daily allowance. kind 1 = calls into contract `target`; kind 2 = txs whose payee is account `target`.
message allowance_object {
  uint32 id = 1;
  bytes buyer = 2 [(koinos.btype) = ADDRESS];
  uint32 kind = 3;
  bytes target = 4 [(koinos.btype) = ADDRESS];
  uint64 mana_per_day = 5 [jstype = JS_STRING];
  uint64 expiry = 6 [jstype = JS_STRING];
  window_object day = 7;
  // Price snapshot of the CURRENT prepaid term (set at buy, replaced at each renewal; every term is also in an event).
  bytes token = 8 [(koinos.btype) = CONTRACT_ID];
  uint64 term_days = 9 [jstype = JS_STRING];         // 1, 7 or 30
  uint64 unit_price = 10 [jstype = JS_STRING];       // tier price per 1,000 Mana/day in force when this term was paid
  uint64 paid = 11 [jstype = JS_STRING];             // paid for this term
  uint64 term_start = 12 [jstype = JS_STRING];
  uint64 total_paid = 13 [jstype = JS_STRING];       // all terms together
  repeated uint32 purchase_ids = 14;                  // escrow purchases (terms) of this allowance
}

// A prepaid big upload for `payee`: up to `mana` in total, each tx up to `mana`, until expiry.
message ticket_object {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
  uint64 mana = 2 [jstype = JS_STRING];
  uint64 remaining = 3 [jstype = JS_STRING];
  uint64 expiry = 4 [jstype = JS_STRING];
  bool allow_upload = 5;                             // may pay for uploading the payee's own contract
  bytes token = 6 [(koinos.btype) = CONTRACT_ID];    // price snapshot at purchase
  uint64 paid = 7 [jstype = JS_STRING];
  uint32 purchase_id = 8;                            // escrow purchase
  uint64 bought = 9 [jstype = JS_STRING];            // purchase time (weekly-cap slot, station wait)
  uint64 prev_last_buy = 10 [jstype = JS_STRING];    // UNUSED since audit #2 (the station-wide wait was removed)
}

// Station-wide big-upload state. Debt is an estimate repaid at the sold slice's daily rate. Since audit #2 it only gates
// new big-upload sales and unreserved exempt projects; it never pauses paid allowances. The reserve itself is protected
// by the live floor check (big uploads and buffers never take Mana below admin_min + one day's budget).
message big_object {
  uint64 debt = 1 [jstype = JS_STRING];
  uint64 debt_ts = 2 [jstype = JS_STRING];
  uint64 last_buy = 3 [jstype = JS_STRING];          // UNUSED since audit #2 (cooldown is per buyer now)
  window_object week = 4;
  uint32 next_id = 5;                                // allowance ids
  bool low_alerted = 6;                              // reserve_low already emitted for this dip
  uint32 next_purchase = 7;                          // escrow purchase ids
  uint64 paused_at = 8 [jstype = JS_STRING];         // set while paused: the escrow clock stops here
  uint64 ticket_open = 9 [jstype = JS_STRING];       // review H1: unused Mana locked by open tickets (kept above the floor)
}

// Payload of station.allowance_bought / station.allowance_renewed / station.big_upload_bought, with the purchase terms.
message purchase_event {
  allowance_object allowance = 1;
  ticket_object ticket = 2;
  bytes token = 3 [(koinos.btype) = CONTRACT_ID];
  uint64 paid = 4 [jstype = JS_STRING];
  bool refundable = 5;                      // true (escrow, pro-rata on cancel)
  bool auto_renew = 6;                      // always false
  string terms = 7;
}

// Emitted when a fee-exempt reserved app uses its buffer (Mana above its daily allowance, from the reserve).
message buffer_event {
  uint32 app = 1;
  bytes payee = 2 [(koinos.btype) = ADDRESS];
  uint64 rc = 3 [jstype = JS_STRING];
  uint64 app_used_24h = 4 [jstype = JS_STRING];      // including this tx
  uint64 allowance = 5 [jstype = JS_STRING];
  uint64 buffer_limit = 6 [jstype = JS_STRING];
  uint64 mana_after = 7 [jstype = JS_STRING];
}

// Emitted once each time the station's Mana falls below the alert level: Carl should add KOIN.
message reserve_alert_event {
  uint64 mana_after = 1 [jstype = JS_STRING];
  uint64 alert_level = 2 [jstype = JS_STRING];
  uint64 hard_floor = 3 [jstype = JS_STRING];
}

// Explicit indexes (no open-ended storage scans): Carl's app ids and open sold-allowance ids.
message registry_object {
  repeated uint32 app_ids = 1;
  repeated uint32 open_ids = 2;
  repeated uint32 open_purchases = 3;                // escrow purchases not yet closed (bounded)
}

// One prepaid purchase held in the station's escrow (Carl, 7:47 PM). kind 1 = an allowance term, kind 2 = a big-upload
// ticket. Invariant: amount = refunded + released + still held; closed means held = 0.
message escrow_object {
  uint32 id = 1;
  uint32 kind = 2;
  bytes buyer = 3 [(koinos.btype) = ADDRESS];
  bytes token = 4 [(koinos.btype) = CONTRACT_ID];
  uint64 amount = 5 [jstype = JS_STRING];
  uint64 start = 6 [jstype = JS_STRING];
  uint64 end = 7 [jstype = JS_STRING];               // releasable to Carl from here (moves with pause credit)
  uint64 days = 8 [jstype = JS_STRING];              // allowance term length (whole days)
  uint64 per_day = 9 [jstype = JS_STRING];           // amount / days, rounded down (informational)
  uint32 allowance_id = 10;
  bytes payee = 11 [(koinos.btype) = ADDRESS];       // ticket payee
  uint64 mana = 12 [jstype = JS_STRING];             // ticket Mana
  uint64 refunded = 13 [jstype = JS_STRING];
  uint64 released = 14 [jstype = JS_STRING];
  bool closed = 15;
  uint64 min_keep = 16 [jstype = JS_STRING];         // review M3: buyer cancels never refund below this (min charge at purchase)
}

// Per token: held = Σ (amount − refunded − released) over all purchases; must equal the station's token balance.
message escrow_totals_object {
  uint64 held = 1 [jstype = JS_STRING];
  uint64 collected = 2 [jstype = JS_STRING];
  uint64 refunded = 3 [jstype = JS_STRING];
  uint64 released = 4 [jstype = JS_STRING];
}

// station.escrow_refunded / station.escrow_released
message escrow_event {
  escrow_object purchase = 1;
  uint64 amount = 2 [jstype = JS_STRING];
  bytes to = 3 [(koinos.btype) = ADDRESS];
  string action = 4;                                 // "cancel", "owner_refund", "ticket_settle", "release"
}

message revenue_object {
  uint64 total = 1 [jstype = JS_STRING];             // collected, not yet withdrawn (token units)
}

// ════════ Read-only ════════

// @description Station budgets, Mana, floors and big-upload state.
// @read-only true
message get_status_arguments {}

message get_status_result {
  config_object config = 1;
  uint64 mana = 2 [jstype = JS_STRING];
  uint64 daily_budget = 3 [jstype = JS_STRING];
  uint64 reserve_floor = 4 [jstype = JS_STRING];      // koin_amount - daily_budget (80%)
  uint64 big_floor = 5 [jstype = JS_STRING];          // admin_min + daily_budget: big uploads never go below
  uint64 used_24h = 6 [jstype = JS_STRING];
  uint64 sold_capacity = 7 [jstype = JS_STRING];      // derived: daily budget − reservations
  uint64 sold_committed = 8 [jstype = JS_STRING];
  uint64 big_debt = 9 [jstype = JS_STRING];
  uint64 buffer_used_24h = 10 [jstype = JS_STRING];   // reserve Mana used by app buffers (not in used_24h)
  uint64 alert_level = 11 [jstype = JS_STRING];
  bytes treasury = 12 [(koinos.btype) = ADDRESS];     // where payments land now
}

// @description One user's counters.
// @read-only true
message get_user_arguments {
  bytes user = 1 [(koinos.btype) = ADDRESS];
}

message get_user_result {
  user_object user = 1;
  uint32 actions_24h = 2;
  uint64 mana_24h = 3 [jstype = JS_STRING];
}

// @description One of Carl's apps: allowance and rolling 24 h use.
// @read-only true
message get_app_arguments {
  uint32 app = 1;
}

message get_app_result {
  app_object app = 1;
  uint64 allowance = 2 [jstype = JS_STRING];
  uint64 used_24h = 3 [jstype = JS_STRING];
  uint64 new_used_24h = 4 [jstype = JS_STRING];
}

// @description Allowlist entry for a contract + entry point.
// @read-only true
message get_entry_arguments {
  bytes contract_id = 1 [(koinos.btype) = CONTRACT_ID];
  uint32 entry_point = 2;
}

message get_entry_result {
  entry_object entry = 1;
}

// @description Price of a sold daily allowance.
// @read-only true
message quote_allowance_arguments {
  bytes token = 1 [(koinos.btype) = CONTRACT_ID];
  uint64 mana_per_day = 2 [jstype = JS_STRING];
  uint64 days = 3 [jstype = JS_STRING];
}

message quote_allowance_result {
  // Shown by the UI before purchase (Carl, 7:32 PM): prepaid for future use, no refunds, no auto-renew.
  bool refundable = 5;                     // true: unused whole days (allowance) / unused Mana (ticket) on cancel
  bool auto_renew = 6;                     // always false
  string terms = 7;
  uint64 price = 1 [jstype = JS_STRING];   // token units (vUSDT / vUSDC: 8 decimals)
  bool available = 2;
  string reason = 3;
  uint64 unit_price = 4 [jstype = JS_STRING]; // tier price per 1,000 Mana(/day) used
}

// @description Price of a big upload and whether the reserve can take it now.
// @read-only true
message quote_big_upload_arguments {
  bytes token = 1 [(koinos.btype) = CONTRACT_ID];
  uint64 mana = 2 [jstype = JS_STRING];
}

message quote_big_upload_result {
  // Shown by the UI before purchase (Carl, 7:32 PM): prepaid for future use, no refunds, no auto-renew.
  bool refundable = 5;                     // true: unused whole days (allowance) / unused Mana (ticket) on cancel
  bool auto_renew = 6;                     // always false
  string terms = 7;
  uint64 price = 1 [jstype = JS_STRING];
  bool available = 2;
  string reason = 3;
  uint64 unit_price = 4 [jstype = JS_STRING];
}

// @description A sold allowance by id.
// @read-only true
message get_allowance_arguments {
  uint32 id = 1;
}

message get_allowance_result {
  allowance_object allowance = 1;
  uint64 used_24h = 2 [jstype = JS_STRING];
}

// @description A big-upload ticket by payee.
// @read-only true
message get_ticket_arguments {
  bytes payee = 1 [(koinos.btype) = ADDRESS];
}

message get_ticket_result {
  ticket_object ticket = 1;
}

// ════════ Buy (anyone) ════════

// @description Buy a daily Mana allowance for an app contract (kind 1) or an account (kind 2) for N prepaid days.
// @read-only false
message buy_allowance_arguments {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
  uint32 kind = 2;
  bytes target = 3 [(koinos.btype) = ADDRESS];
  uint64 mana_per_day = 4 [jstype = JS_STRING];
  uint64 days = 5 [jstype = JS_STRING];
  bytes token = 6 [(koinos.btype) = CONTRACT_ID];
  uint64 max_price = 7 [jstype = JS_STRING];          // the quote the buyer accepted
}

message buy_allowance_result {
  uint32 id = 1;
  uint64 expiry = 2 [jstype = JS_STRING];
  uint64 paid = 3 [jstype = JS_STRING];
}

// @description Extend a sold allowance by one more 1, 7 or 30 day term, paid now at the price CURRENT at renewal
// (not the original price). Only by explicit call signed by the payer: there is no auto-renew.
// @read-only false
message renew_arguments {
  bytes payer = 1 [(koinos.btype) = ADDRESS];
  uint32 id = 2;
  uint64 days = 3 [jstype = JS_STRING];
  bytes token = 4 [(koinos.btype) = CONTRACT_ID];
  uint64 max_price = 5 [jstype = JS_STRING];
}

message renew_result {
  uint64 expiry = 1 [jstype = JS_STRING];
  uint64 paid = 2 [jstype = JS_STRING];
  uint64 unit_price = 3 [jstype = JS_STRING];        // current tier price applied to this renewal
}

// @description Buy a one-time big upload (prepaid quoted Mana, expires) for `payee`.
// @read-only false
message buy_big_upload_arguments {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
  bytes payee = 2 [(koinos.btype) = ADDRESS];
  uint64 mana = 3 [jstype = JS_STRING];
  bytes token = 4 [(koinos.btype) = CONTRACT_ID];
  uint64 max_price = 5 [jstype = JS_STRING];
  bool allow_upload = 6;
}

message buy_big_upload_result {
  uint64 expiry = 1 [jstype = JS_STRING];
  uint64 paid = 2 [jstype = JS_STRING];
}

// @description After a ticket expires, release its unused Mana from the big-upload debt (anyone).
// @read-only false
message close_ticket_arguments {
  bytes payee = 1 [(koinos.btype) = ADDRESS];
}

message close_ticket_result {
  uint64 refund = 1 [jstype = JS_STRING];
  uint64 released = 2 [jstype = JS_STRING];
}

// @description Buyer cancels an allowance: unused WHOLE days of every term are refunded from escrow (the current day
// counts as used: 1 day minimum). Service continues to the end of the paid current day.
// @read-only false
message cancel_allowance_arguments {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
  uint32 id = 2;
}

message cancel_allowance_result {
  uint64 refund = 1 [jstype = JS_STRING];
  uint64 expiry = 2 [jstype = JS_STRING];
}

// @description Buyer cancels a big-upload ticket: unused Mana refunded pro rata, minimum charge 20% of the ticket.
// @read-only false
message cancel_big_upload_arguments {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
  bytes payee = 2 [(koinos.btype) = ADDRESS];
}

message cancel_big_upload_result {
  uint64 refund = 1 [jstype = JS_STRING];
}

// @description After a term ends (anyone may call): send the earned, unrefunded amount to Carl (treasury). Once.
// @read-only false
message release_arguments {
  uint32 purchase_id = 1;
}

message release_result {
  uint64 amount = 1 [jstype = JS_STRING];
}

// @description Owner refunds unused value: an allowance (unused whole days, current day used) or a big-upload ticket
// (unused Mana, no minimum charge). For buyers suspended without fault, or by owner choice. Refused while the buyer is
// suspended for sanctions (reason 2): reclassify a false match as reason 4 first.
// @read-only false
message owner_refund_arguments {
  uint32 allowance_id = 1;
  bytes ticket_payee = 2 [(koinos.btype) = ADDRESS];
}

message owner_refund_result {
  uint64 refund = 1 [jstype = JS_STRING];
}

// @description One escrow purchase.
// @read-only true
message get_escrow_arguments {
  uint32 purchase_id = 1;
}

message get_escrow_result {
  escrow_object purchase = 1;
  uint64 refundable_now = 2 [jstype = JS_STRING];    // what a buyer cancel would refund now
  bool releasable = 3;
}

// @description Escrow totals for a token.
// @read-only true
message get_escrow_totals_arguments {
  bytes token = 1 [(koinos.btype) = CONTRACT_ID];
}

message get_escrow_totals_result {
  escrow_totals_object totals = 1;
}

// ════════ Admin (owner only) ════════

// @description First-time setup (station key).
// @read-only false
message init_arguments {
  config_object config = 1;
}

message init_result {}

// @description Replace the settings (owner).
// @read-only false
message set_config_arguments {
  config_object config = 1;
}

message set_config_result {}

// @description Kill switch (owner).
// @read-only false
message set_paused_arguments {
  bool paused = 1;
}

message set_paused_result {}

// @description Add or change one of Carl's apps, its allowance and any explicit boost (owner).
// @read-only false
message set_app_arguments {
  uint32 app = 1;
  app_object value = 2;
}

message set_app_result {}

// @description Allow or remove a contract + entry point (owner).
// @read-only false
message set_entry_arguments {
  bytes contract_id = 1 [(koinos.btype) = CONTRACT_ID];
  uint32 entry_point = 2;
  entry_object value = 3;
  bool remove = 4;
}

message set_entry_result {}

// A suspended buyer (Carl, 7:37 PM). Reason codes: 1 abuse, 2 sanctions / flagged address, 3 AUP violation, 4 legal or other.
message suspend_object {
  uint32 reason = 1;
  uint64 since = 2 [jstype = JS_STRING];
}

message suspend_event {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
  uint32 reason = 2;
  bool suspended = 3;                                   // false = unsuspended
  uint64 at = 4 [jstype = JS_STRING];
}

// @description Suspend a buyer (owner only): every allowance and big-upload ticket that buyer paid for stops being
// sponsored, and new buys / renewals by them are refused. Moves no money, no refund; suspended time is not extended or
// credited. Emits station.buyer_suspended with the reason code.
// @read-only false
message suspend_allowance_arguments {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
  uint32 reason = 2;
}

message suspend_allowance_result {}

// @description Lift a buyer's suspension (owner only). Expiry dates are unchanged. Emits station.buyer_unsuspended.
// @read-only false
message unsuspend_allowance_arguments {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
  uint32 reason = 2;                                    // why it was lifted (same codes, 0 = resolved)
}

message unsuspend_allowance_result {}

// @description A buyer's suspension (empty if not suspended).
// @read-only true
message get_suspension_arguments {
  bytes buyer = 1 [(koinos.btype) = ADDRESS];
}

message get_suspension_result {
  suspend_object suspension = 1;
}

// @description Add, change or remove a fee-exempt contract (owner only; emits station.exempt_changed).
// @read-only false
message set_exempt_arguments {
  bytes contract_id = 1 [(koinos.btype) = CONTRACT_ID];
  exempt_object value = 2;
  bool remove = 3;
}

message set_exempt_result {}

// @description A fee-exempt entry (empty if not exempt).
// @read-only true
message get_exempt_arguments {
  bytes contract_id = 1 [(koinos.btype) = CONTRACT_ID];
}

message get_exempt_result {
  exempt_object exempt = 1;
}

// @description Set the price for a stablecoin (owner).
// @read-only false
message set_price_arguments {
  bytes token = 1 [(koinos.btype) = CONTRACT_ID];
  price_object value = 2;
}

message set_price_result {}

// (withdraw_revenue removed: all payments are escrow; Carl gets funds only through release / ticket settlement.)

// (7:47 PM: the 7:32 "no refunds" rule is superseded: buyer cancel with pro-rata refunds from escrow, see cancel_allowance.)
