syntax = "proto3";

package station;

import "koinos/options.proto";

// ════════ Stored objects ════════

message config_object {
  bytes owner = 1 [(koinos.btype) = ADDRESS];      // admin (Carl's offline wallet on mainnet); may pause / configure
  bool paused = 2;                                  // kill switch: no sponsorship at all while true
  uint64 floor = 3 [jstype = JS_STRING];            // rolling reserve: sponsorship never takes Mana below this
  uint64 hard_max = 4 [jstype = JS_STRING];         // largest rc_limit ever sponsored
  uint32 per_min = 5;                               // sponsored txs per user per minute
  uint64 cooldown_ms = 6 [jstype = JS_STRING];      // pause for a user who used up a minute's allowance
  uint32 day_actions = 7;                           // per user, rolling 24 h
  uint64 day_mana = 8 [jstype = JS_STRING];         // per user, rolling 24 h (counted at rc_limit)
  uint32 new_actions = 9;                           // first 24 h after a user's first sponsored tx
  uint64 new_mana = 10 [jstype = JS_STRING];
  uint32 new_pct = 11;                              // all new users together: % of an app's share
  uint32 max_ops = 12;                              // operations per sponsored tx
  uint32 refill_pct = 13;                           // share base: % of the station balance per day (20 = full regen)
  uint64 budget_base = 14 [jstype = JS_STRING];     // 0 = use the live KOIN balance; else fixed base (testnet/tests)
}

// An app gets share_pct % of the daily refill. Shares are configurable; their sum should be <= 100.
message app_object {
  uint32 share_pct = 1;
  bool active = 2;
}

// One allowlisted (contract, entry point). cap = the largest rc_limit sponsored for that action.
message entry_object {
  uint32 app = 1;
  uint64 cap = 2 [jstype = JS_STRING];
  uint32 max_args = 3;                               // largest argument size in bytes
}

// Rolling window as a ring of time buckets: bucket i covers [ (base+i)*len, (base+i+1)*len ).
message window_object {
  uint64 base = 1 [jstype = JS_STRING];             // slot number of bucket 0
  repeated uint32 n = 2;                            // actions per bucket
  repeated uint64 mana = 3 [jstype = JS_STRING];    // rc_limit sum per bucket
  repeated uint64 new_mana = 4 [jstype = JS_STRING];// app windows only: part spent by new users
}

message user_object {
  uint64 first_seen = 1 [jstype = JS_STRING];
  uint64 last_block = 2 [jstype = JS_STRING];
  uint64 minute = 3 [jstype = JS_STRING];
  uint32 n_min = 4;
  uint64 cooldown_until = 5 [jstype = JS_STRING];
  window_object day = 6;
}

// ════════ Read-only ════════

// @description Station settings, Mana, floor and Mana available for sponsorship.
// @read-only true
message get_status_arguments {}

message get_status_result {
  config_object config = 1;
  uint64 mana = 2 [jstype = JS_STRING];
  uint64 available = 3 [jstype = JS_STRING];
  uint64 daily_refill = 4 [jstype = JS_STRING];
}

// @description One user's counters.
// @read-only true
message get_user_arguments {
  bytes user = 1 [(koinos.btype) = ADDRESS];
}

message get_user_result {
  user_object user = 1;
  uint32 actions_24h = 2;
  uint64 mana_24h = 3 [jstype = JS_STRING];
}

// @description One app's share and its rolling 24 h use.
// @read-only true
message get_app_arguments {
  uint32 app = 1;
}

message get_app_result {
  app_object app = 1;
  uint64 share = 2 [jstype = JS_STRING];
  uint64 used_24h = 3 [jstype = JS_STRING];
  uint64 new_used_24h = 4 [jstype = JS_STRING];
}

// @description The allowlist entry for a contract + entry point (empty if not allowed).
// @read-only true
message get_entry_arguments {
  bytes contract_id = 1 [(koinos.btype) = CONTRACT_ID];
  uint32 entry_point = 2;
}

message get_entry_result {
  entry_object entry = 1;
}

// ════════ Admin (owner only) ════════

// @description First-time setup: sets the owner and the settings (once).
// @read-only false
message init_arguments {
  config_object config = 1;
}

message init_result {}

// @description Replace the settings (owner only).
// @read-only false
message set_config_arguments {
  config_object config = 1;
}

message set_config_result {}

// @description Kill switch (owner only).
// @read-only false
message set_paused_arguments {
  bool paused = 1;
}

message set_paused_result {}

// @description Add or change an app and its share (owner only).
// @read-only false
message set_app_arguments {
  uint32 app = 1;
  app_object value = 2;
}

message set_app_result {}

// @description Allow (or, with remove, stop) a contract + entry point (owner only).
// @read-only false
message set_entry_arguments {
  bytes contract_id = 1 [(koinos.btype) = CONTRACT_ID];
  uint32 entry_point = 2;
  entry_object value = 3;
  bool remove = 4;
}

message set_entry_result {}
